# ============================================================================
# Company Central Platform — continuous integration
#
# Present from Phase 1, not Phase 18 (PROJECT_PLAN.md §2c). A pipeline added
# near the end of a project never ran against the code that most needed it.
#
# Gates, in order of how fast they fail:
#   build → unit tests → architecture tests → integration tests
#         → format → secret scan → dependency audit → container build
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  # -------------------------------------------------------------------------
  # Build and the tests that need no external dependency. Fails fastest.
  # -------------------------------------------------------------------------
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # Version comes from global.json, so CI and every developer machine
          # build with the same SDK.
          global-json-file: global.json

      # S3-compatible object storage, so the provider that actually holds a
      # company's documents is exercised rather than read. Three of ADR-014's
      # claims cannot be checked any other way: that a pre-signed URL works,
      # that it expires, and that the bucket is unreadable without one.
      #
      # A step rather than a service container, because MinIO needs its
      # "server /data" arguments and the services syntax has nowhere to put
      # them. The image and the command are the ones in docker-compose.yml, so
      # what CI exercises is what a developer runs.
      #
      # From quay.io rather than Docker Hub: MinIO withdrew the `latest` tag
      # there, so `docker pull minio/minio` fails with "repository does not
      # exist" -- which is Docker Hub's message for a tag that is gone, and
      # reads like a permissions problem. Quay is MinIO's own registry and still
      # carries it.
      - name: Start object storage
        env:
          MINIO_ROOT_USER: ci_only_not_a_real_key
          MINIO_ROOT_PASSWORD: ci_only_not_a_real_secret
        run: |
          docker run -d --name ccp-ci-minio -p 9000:9000 -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD quay.io/minio/minio:latest server /data

          for attempt in $(seq 1 40); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "Object storage is ready after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 1
          done

          echo "Object storage did not become ready."
          docker logs ccp-ci-minio
          exit 1

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The committed contract must match what the endpoints actually declare.
      # Without this the frontend would keep generating types from a stale
      # document and still pass — which is the failure the generation exists to
      # prevent, wearing a different hat.
      - name: API contract is up to date
        run: |
          bash scripts/regenerate-contract.sh
          git diff --exit-code contracts/platform-api.json

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      # A broken link in a runbook is found by somebody at three in the morning
      # who needed the page it pointed at. Documentation rots silently: a file is
      # renamed, a section folded into another, and nothing complains.
      - name: Documentation links resolve
        run: python scripts/check-doc-links.py

      # Documentation drift is this project's most common defect. Four documents
      # were once found describing a Platform that had stopped existing phases
      # earlier, every one of them caught by a person reading rather than by the
      # build. This checks the half a build can check: that an endpoint a
      # document tells somebody to call is really there.
      - name: Documented endpoints exist
        run: python scripts/check-doc-endpoints.py

      # The same defect in the file people actually read to find out where the
      # project is. Its summary sections drifted further than anything else,
      # because the detail gets edited every phase and the summary gets edited
      # when somebody remembers: section 2 once opened with "no capability
      # module has been implemented" while eleven were deployed with screens.
      # This catches the two parts with a shape -- the phase summary agreeing
      # with the phase table, and every module having a row.
      - name: Status document agrees with itself
        run: python scripts/check-status-consistency.py

      - name: Unit tests
        run: >-
          dotnet test tests/CCP.Kernel.UnitTests/CCP.Kernel.UnitTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=unit.trx"
          --collect:"XPlat Code Coverage"

      # The architecture rules of ARCHITECTURE.md §6, as executable assertions.
      # A violation fails the build rather than being noticed in review, or not.
      - name: Architecture tests
        run: >-
          dotnet test tests/CCP.Architecture.Tests/CCP.Architecture.Tests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=architecture.trx"

      - name: Integration tests
        env:
          CCP_TEST_POSTGRES: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ci_only_not_a_real_secret"
          CCP_TEST_S3_URL: "http://localhost:9000"
          CCP_TEST_S3_ACCESS_KEY: ci_only_not_a_real_key
          CCP_TEST_S3_SECRET_KEY: ci_only_not_a_real_secret
        run: >-
          dotnet test tests/CCP.Api.IntegrationTests/CCP.Api.IntegrationTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=integration.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"
          retention-days: 14

  # -------------------------------------------------------------------------
  # Security gates. Separate job so a failure here is unambiguous.
  # -------------------------------------------------------------------------
  security:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and then removed is still a leaked
          # secret, and scanning only the tip would miss it.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # ARCHITECTURE.md P8. This is the control; discipline alone is not one.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore

      - name: Vulnerable dependency audit
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q -E "Critical|High" audit.txt; then
            echo "::error::High or critical severity vulnerability found in dependencies."
            exit 1
          fi

      - name: Deprecated dependency report
        continue-on-error: true
        run: dotnet list package --deprecated

  # -------------------------------------------------------------------------
  # Container image. Built on every run so a Dockerfile break is caught early;
  # pushed only from the protected branches.
  # -------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Frontend
  #
  # Typecheck, lint and build, plus the tests that guard the design rules of
  # ARCHITECTURE.md section 9.5 - no icon package, no physical direction
  # utilities, no third hue, no token in browser storage. Those are acceptance
  # criteria that erode quietly, so they are checked on every push rather than
  # at review.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # The generated types must match the committed contract. If a backend
      # change altered a response and nobody regenerated, this fails here rather
      # than in front of a user — which is the entire reason the types are
      # generated instead of written.
      - name: Types match the contract
        run: npm run verify:types

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # End to end
  #
  # The whole stack: a database, the API, and the frontend serving through its
  # BFF. Every spec runs twice, once per language, because the Arabic interface
  # mirrors the layout rather than translating it and a suite that tested one
  # direction would leave half the company untested.
  #
  # This job exists because of a day on which four defects reached the deployed
  # application while every unit test passed: portal pages prerendered so
  # sign-in bounced back to login, no custom colour rendered at all, the
  # employees screen called a path that does not exist, and concurrent requests
  # each refreshed the token until the Platform revoked the session. None of
  # those lives in a unit.
  # ---------------------------------------------------------------------------
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ccp_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CCP_ConnectionStrings__Platform: "Host=localhost;Port=5432;Database=ccp_e2e;Username=postgres;Password=ci_only_not_a_real_secret"
      CCP_Database__ApplyMigrationsOnStartup: "true"

      # A fresh database every run, so the seeder creates the account these
      # tests sign in as. The password is a CI-only value for a throwaway
      # database that exists for four minutes.
      CCP_Identity__Bootstrap__Enabled: "true"
      CCP_Identity__Bootstrap__Username: "e2e-admin"
      CCP_Identity__Bootstrap__Email: "e2e@example.invalid"
      CCP_Identity__Bootstrap__DisplayName: "End To End"
      CCP_Identity__Bootstrap__InitialPassword: "e2e-not-a-real-secret-2026"

      E2E_USERNAME: "e2e-admin"
      E2E_PASSWORD: "e2e-not-a-real-secret-2026"
      E2E_BASE_URL: "http://localhost:3000"
      PLATFORM_API_URL: "http://localhost:5080"

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Generated at run time and never committed. A signing key in the
      # repository would be a signing key in every clone.
      # Generated per run and thrown away, so nothing here is a real secret. They
      # are masked anyway: a value written through GITHUB_ENV is echoed in full
      # in the environment block of every subsequent step, and a signing key
      # printed in a log is a signing key in a log whatever its lifetime. Masking
      # also keeps the habit intact — the next person to add a key here should
      # not have to notice the difference.
      - name: Generate development keys
        run: |
          signing_key="$(openssl genrsa 3072 2>/dev/null | base64 -w0)"
          mfa_key="$(openssl rand -base64 32)"

          echo "::add-mask::$signing_key"
          echo "::add-mask::$mfa_key"

          echo "CCP_Identity__SigningKey=$signing_key" >> "$GITHUB_ENV"
          echo "CCP_Security__MfaProtection__Key=$mfa_key" >> "$GITHUB_ENV"

      # Output to a file, not to the void. Both servers ran with their logs
      # discarded, so a 500 in an end-to-end run said only "500" — the stack
      # trace explaining it was written to a stream nothing was reading.
      - name: Start the API
        run: |
          dotnet run --project src/Host/CCP.Api.Host --configuration Release --urls http://localhost:5080             > api.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:5080/health/ready > /dev/null; then
              echo "API ready."
              exit 0
            fi
            sleep 2
          done
          echo "The API did not become ready." >&2
          cat api.log >&2
          exit 1

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start the frontend
        working-directory: frontend
        run: |
          npm start -- --port 3000 > ../frontend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:3000/ar/login > /dev/null; then
              echo "Frontend ready."
              exit 0
            fi
            sleep 2
          done
          echo "The frontend did not become ready." >&2
          cat ../frontend.log >&2
          exit 1

      - name: Run end-to-end tests
        working-directory: frontend
        run: npx playwright test

      # The half of the story Playwright cannot see. A route handler that
      # throws answers 500 with an empty body; the reason is in these logs and
      # nowhere else.
      - name: Show the server logs
        if: failure()
        run: |
          echo "::group::API"
          tail -n 200 api.log || echo "no API log"
          echo "::endgroup::"
          echo "::group::Frontend"
          tail -n 200 frontend.log || echo "no frontend log"
          echo "::endgroup::"

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: [build-and-test, security]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/api.Dockerfile
          push: false
          # Load the result into the local Docker daemon. Without this, buildx's
          # docker-container driver leaves the image in the build cache only,
          # and the scan below fails with "unable to find the specified image"
          # - which reads like a scanner problem and is not one.
          load: true
          tags: ccp-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        # Pinned to a tag that exists. 0.28.0 never did, so this job failed to
        # start rather than failing a scan - and the container image was
        # therefore never built or scanned even once.
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ccp-api:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
