# ============================================================================
# Company Central Platform — local development dependencies
#
# This file provides the SERVICES the Platform depends on, not the Platform
# itself. The API and frontend run on the host during development for fast
# iteration (see docs/development/local-environment.md).
#
#   docker compose up -d
#
# Credentials here are LOCAL DEVELOPMENT ONLY and are deliberately weak and
# well-known. They are safe to commit precisely because they grant access to
# nothing but a throwaway container on a developer's own machine.
# Production credentials come from the cloud secret manager (ARCHITECTURE.md
# §12.7) and never appear in any file in this repository.
# ============================================================================

name: ccp

services:
  postgres:
    image: postgres:17-alpine
    container_name: ccp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ccp_platform
      POSTGRES_USER: ccp_dev
      POSTGRES_PASSWORD: ccp_dev_local_only
      # Deterministic collation so ordering matches across developer machines.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccp_dev -d ccp_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # S3-compatible object storage for the Documents module (ADR-014).
  # Production uses the cloud provider's object storage; the API is the same.
  minio:
    # **MinIO's own images are no longer public.** Docker Hub first, then
    # quay.io: an anonymous pull of either now answers "unauthorized", at
    # `latest` and at pinned release tags alike.
    #
    # `bitnamilegacy` is Bitnami's archive of what they stopped publishing, and
    # it is a real MinIO rather than a test double. The distinction is not
    # academic: the S3 mocks built for testing validate no signature at all,
    # and two of the Documents module's assertions are precisely that an
    # unsigned request is refused and that a pre-signed URL expires.
    #
    # Frozen, and so a stopgap until the cloud provider decision (Q4).
    #
    # No `command:`. This image's entrypoint starts MinIO itself, and an
    # argument here would replace the script that does it.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: ccp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ccp_dev
      MINIO_ROOT_PASSWORD: ccp_dev_local_only
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      # A port that answers, not a service that is ready, and the difference is
      # worth stating: this says MinIO is listening, not that it has finished
      # starting. Nothing in this file waits on it, and a check written around
      # a tool the image may not ship would fail for the wrong reason.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Catches all outbound mail in development so no real message is ever sent
  # from a developer machine. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: ccp-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  minio-data:
